name: PR checks

# pr-gate is the required check (.github/rulesets/main.json). A job added here goes in
# pr-gate's needs, its local command in pr-gate's COMMANDS, and the line where its
# failure report starts in MARKERS in scripts/ci/failure-excerpt.js.
on:
  pull_request:
    branches: [main, next, 'release/**']
  push:
    branches: [main, next, 'release/**']
  workflow_call:

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Every other run gets its own group,
# so branch pushes and workflow_call runs never cancel each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-checks-{0}', github.event.pull_request.number) || format('pr-checks-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      excerpt: ${{ steps.excerpt.outputs.excerpt }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The release tags, so test/kernel/storage-recorded.test.mjs checks each recorded
      # fixture's commit and tree against its tag; NTN_RELEASE_TAGS makes a missing tag fail
      - name: Fetch the release tags
        run: git fetch --no-tags --depth=1 origin '+refs/tags/v1.*:refs/tags/v1.*' 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: npm ci --ignore-scripts
        run: npm ci --ignore-scripts 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: npm test
        env:
          NTN_RELEASE_TAGS: required
        run: npm test 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: Record the failure for pr-gate
        id: excerpt
        if: failure() || cancelled()
        run: node scripts/ci/failure-excerpt.js "$RUNNER_TEMP/job.log" unit

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      excerpt: ${{ steps.excerpt.outputs.excerpt }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: npm ci --ignore-scripts
        run: npm ci --ignore-scripts 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: npm run typecheck:ratchet
        run: npm run typecheck:ratchet 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: Record the failure for pr-gate
        id: excerpt
        if: failure() || cancelled()
        run: node scripts/ci/failure-excerpt.js "$RUNNER_TEMP/job.log" typecheck

  # The kernel checks from #12 (docs/adr/0001-kernel-stack.md), here until #29 takes them
  kernel:
    name: kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      excerpt: ${{ steps.excerpt.outputs.excerpt }}
      # pr-gate prints it as the kernel job's local command
      command: ${{ steps.ledger-base.outputs.command }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD^1 too, which check:boundaries compares with on a pull request (whose HEAD
          # is the merge commit) and on a push with no before (scripts/ci/ledger-base.js)
          fetch-depth: 2
      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # First, so pr-gate has the local command even when a later step fails
      - name: Fetch the ledger check:boundaries compares with
        id: ledger-base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/ci/ledger-base.js 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: npm ci --ignore-scripts
        run: npm ci --ignore-scripts 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: npm run test:kernel
        run: npm run test:kernel 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: npm run typecheck:kernel
        run: npm run typecheck:kernel 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      # No --base when ledger-base.js found no parent commit to compare with
      - name: npm run check:boundaries
        env:
          BASE: ${{ steps.ledger-base.outputs.base }}
        run: npm run check:boundaries -- ${BASE:+--base "$BASE"} 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      # #21 slice 1b: security/changes.json keeps every entry the same base has, so entries are
      # only appended. With CI set, a base it can't read, or none, fails the step
      - name: npm run check:security-baseline -- --history-only
        env:
          BASE: ${{ steps.ledger-base.outputs.base }}
        run: npm run check:security-baseline -- --history-only ${BASE:+--base "$BASE"} 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      # #26 slice 1: every contribution has its state rows, or ci/baselines/states.json lists what it's
      # missing, and that baseline only shrinks: an entry the same base doesn't have fails
      - name: npm run check:states
        env:
          BASE: ${{ steps.ledger-base.outputs.base }}
        run: npm run check:states -- ${BASE:+--base "$BASE"} 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      # #24 slice 2: each test/a11y/baseline.json line's page has its spec, and the baseline only
      # shrinks: a line or target the same base doesn't have fails
      - name: npm run check:a11y-baseline
        env:
          BASE: ${{ steps.ledger-base.outputs.base }}
        run: npm run check:a11y-baseline -- ${BASE:+--base "$BASE"} 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: Record the failure for pr-gate
        id: excerpt
        if: failure() || cancelled()
        run: node scripts/ci/failure-excerpt.js "$RUNNER_TEMP/job.log" kernel

  build:
    name: build
    runs-on: ubuntu-24.04
    # verify:reproducible runs two more builds. The fixtures run beside this job, in fixtures-1
    # and fixtures-2 (#29).
    timeout-minutes: 30
    outputs:
      excerpt: ${{ steps.excerpt.outputs.excerpt }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: npm ci --ignore-scripts
        run: npm ci --ignore-scripts 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      # --strict is a no-op since #27, which made what it refused the build's only behavior
      - name: npm run build -- --strict
        run: npm run build -- --strict 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: npm run check:dist
        run: npm run check:dist 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      # #27: two clean builds of the commit package the same zip, before this job packages and
      # uploads its own
      - name: npm run verify:reproducible
        run: npm run verify:reproducible 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: npm run package
        run: npm run package 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: npm run check:notices
        run: npm run check:notices 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
      # The build's module map, which never ships: the extension job's self-tests edit a
      # module in the chunks that hold it (#27 slice 2)
      - name: Upload dist-report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-report
          path: dist-report/
          if-no-files-found: error
          retention-days: 14
      - name: Record the failure for pr-gate
        id: excerpt
        if: failure() || cancelled()
        run: node scripts/ci/failure-excerpt.js "$RUNNER_TEMP/job.log" build

  # #27: each build failure rule fails its fixture. A build or output fixture builds once in each
  # mode it names, both by default, and a package fixture or the canary once, in production, so
  # there are more builds than fixtures. Half the fixtures run in each of these jobs, beside
  # build, so the package and e2e don't wait on them (#29). --shard i/2 takes every second
  # fixture by name from the ith, so the two jobs hold each fixture exactly once. Two named jobs
  # rather than a matrix, since pr-gate reads each one's excerpt and a matrix keeps one leg's.
  fixtures-1:
    name: fixtures-1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      excerpt: ${{ steps.excerpt.outputs.excerpt }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: npm ci --ignore-scripts
        run: npm ci --ignore-scripts 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: npm run verify:fixtures -- --shard 1/2
        run: npm run verify:fixtures -- --shard 1/2 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: Record the failure for pr-gate
        id: excerpt
        if: failure() || cancelled()
        run: node scripts/ci/failure-excerpt.js "$RUNNER_TEMP/job.log" fixtures-1

  fixtures-2:
    name: fixtures-2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      excerpt: ${{ steps.excerpt.outputs.excerpt }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: npm ci --ignore-scripts
        run: npm ci --ignore-scripts 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: npm run verify:fixtures -- --shard 2/2
        run: npm run verify:fixtures -- --shard 2/2 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: Record the failure for pr-gate
        id: excerpt
        if: failure() || cancelled()
        run: node scripts/ci/failure-excerpt.js "$RUNNER_TEMP/job.log" fixtures-2

  extension:
    name: extension
    # Tests the dist/ the build job built with --strict, not a fresh build
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      excerpt: ${{ steps.excerpt.outputs.excerpt }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: npm ci --ignore-scripts
        run: npm ci --ignore-scripts 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Download dist-report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-report
          path: dist-report
      # Chromium only, without the headless shell: the harness runs extensions on the
      # full build (channel: 'chromium'). The locked Playwright from node_modules/.bin, never
      # npx, which can fetch another version.
      - name: Install Playwright Chromium
        run: node_modules/.bin/playwright install --with-deps --no-shell chromium 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: npm run test:extension
        run: npm run test:extension 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      # #24 slice 2: the accessibility check library's own spec, and each page's spec as it lands, held
      # to test/a11y/baseline.json by its reporter. A step here until #29's aggregate gate takes it over
      - name: npm run test:a11y
        run: npm run test:a11y 2>&1 | tee -a "$RUNNER_TEMP/job.log"
      - name: Record the failure for pr-gate
        id: excerpt
        if: failure() || cancelled()
        run: node scripts/ci/failure-excerpt.js "$RUNNER_TEMP/job.log" extension
      # Traces, screenshots, and extension logs of failed attempts, a flaky test's first
      # failure included. A clean run leaves only the hidden .last-run.json, which
      # upload-artifact skips, so it uploads nothing.
      - name: Upload test-results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  pr-gate:
    name: pr-gate
    # always(), so a failed, cancelled, skipped, or timed-out job fails the gate
    # instead of skipping it
    if: always()
    needs: [unit, typecheck, kernel, build, fixtures-1, fixtures-2, extension]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The kernel job passes on its check:boundaries command from scripts/ci/ledger-base.js,
      # which picks the commit the job compared with
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          COMMANDS: >-
            {"unit": "npm test",
            "typecheck": "npm run typecheck:ratchet",
            "kernel": ${{ toJSON(format('npm run test:kernel && npm run typecheck:kernel && {0}', needs.kernel.outputs.command || 'npm run check:boundaries')) }},
            "build": "npm run build -- --strict && npm run check:dist && npm run verify:reproducible && npm run package && npm run check:notices",
            "fixtures-1": "npm run verify:fixtures -- --shard 1/2",
            "fixtures-2": "npm run verify:fixtures -- --shard 2/2",
            "extension": "npm run build -- --strict && npm run test:extension && npm run test:a11y"}
        run: |
          set -euo pipefail
          jq -nr '
            (env.NEEDS | fromjson) as $needs
            | (env.COMMANDS | fromjson) as $commands
            | ([$commands | keys_unsorted[] | select(in($needs))] + (($needs | keys) - ($commands | keys))) as $jobs
            | "## pr-gate",
              "",
              "| Job | Result | Run locally |",
              "| --- | --- | --- |",
              ($jobs[] as $job
                | "| \($job) | \(if $needs[$job].result == "success" then "✅" else "❌" end) \($needs[$job].result) | \(if $commands[$job] then "`\($commands[$job])`" else "not in COMMANDS" end) |"),
              ($jobs[] as $job
                | select($needs[$job].result != "success")
                | "",
                  "### \($job): \($needs[$job].result)",
                  "",
                  (($needs[$job].outputs.excerpt // "") as $excerpt
                    | if $excerpt == "" then "No failure output was captured. If the job ran, its log has the details."
                      else "<pre>\($excerpt | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;"))</pre>" end))
          ' | tee -a "$GITHUB_STEP_SUMMARY"

          total=$(jq -nr 'env.NEEDS | fromjson | length')
          failed=$(jq -nr 'env.NEEDS | fromjson | to_entries | map(select(.value.result != "success") | "\(.key) (\(.value.result))") | join(", ")')
          if [ "$total" -eq 0 ]; then
            echo "::error::pr-gate needs no jobs"
            exit 1
          fi
          if [ -n "$failed" ]; then
            echo "::error::pr-gate: not every job succeeded: $failed"
            exit 1
          fi
          echo "All $total jobs succeeded."
