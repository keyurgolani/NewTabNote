<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab Note Intelligence</title>
  <style>
    :root {
      --bg: #f7f4ee;
      --panel: #fffaf1;
      --ink: #211c18;
      --muted: #70675e;
      --faint: #9b9187;
      --line: #e7dcca;
      --accent: #7c3aed;
      --deadline: #dc2626;
      --todo: #2563eb;
      --reminder: #b45309;
      --highlight: #059669;
      --shadow: 0 10px 30px rgba(61, 42, 22, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15120f;
        --panel: #201b16;
        --ink: #f5efe7;
        --muted: #c2b7aa;
        --faint: #8d8175;
        --line: #342c25;
        --accent: #a78bfa;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.24);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at top left, rgba(124, 58, 237, 0.13), transparent 34%), var(--bg);
      color: var(--ink);
    }

    .shell {
      min-height: 100vh;
      padding: 18px 14px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .subtitle {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .open-notes {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 10px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
    }

    .status {
      margin-bottom: 14px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      box-shadow: var(--shadow);
    }

    .status-count {
      font-size: 26px;
      font-weight: 760;
      letter-spacing: -0.05em;
    }

    .status-label {
      color: var(--muted);
      font-size: 12px;
    }

    .section {
      margin-bottom: 14px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 2px 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: var(--accent);
    }

    .dot.deadline { background: var(--deadline); }
    .dot.todo { background: var(--todo); }
    .dot.reminder { background: var(--reminder); }
    .dot.highlight { background: var(--highlight); }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item {
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .item-text {
      margin: 0 0 7px;
      font-size: 13px;
      line-height: 1.38;
    }

    .item-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--faint);
      font-size: 11px;
    }

    .note-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .date {
      color: var(--deadline);
      font-weight: 700;
      white-space: nowrap;
    }

    .empty {
      margin-top: 22px;
      padding: 18px;
      border: 1px dashed var(--line);
      border-radius: 20px;
      background: color-mix(in srgb, var(--panel) 78%, transparent);
      text-align: left;
    }

    .empty h2 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .empty p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header">
      <div class="brand">
        <img src="icons/icon48.png" alt="New Tab Note">
        <div>
          <h1>Intelligence</h1>
          <span class="subtitle">Extracted from your notes</span>
        </div>
      </div>
      <button id="open-notes" class="open-notes" type="button">Open</button>
    </header>

    <section id="status" class="status hidden" aria-live="polite">
      <div id="status-count" class="status-count">0</div>
      <div class="status-label">items found across your notes</div>
    </section>

    <div id="sections"></div>

    <section id="empty-state" class="empty hidden">
      <h2>No intelligence yet</h2>
      <p>Open a note and run Extract Insights. Deadlines, action items, reminders, and highlights will appear here.</p>
      <button class="open-notes" type="button" data-open-notes>Open Notes</button>
    </section>
  </main>

  <script src="js/insights-summary.js"></script>
  <script src="js/sidepanel.js"></script>
</body>
</html>
