<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script vite-ignore src="js/network-guard.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab Note</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="New Tab Note">
    <div class="header-text">
      <h1>New Tab Note</h1>
      <span class="tagline">Your thoughts, organized</span>
    </div>
    <button id="open-tab" class="btn-open">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
      Open Notes
    </button>
  </div>

  <!-- Quick Note Input -->
  <div class="quick-note">
    <input type="text" id="quick-note-input" placeholder="Quick note... press Enter to save" aria-label="Quick note input" autocomplete="off">
  </div>

  <!-- Main Content - Two Columns -->
  <div id="main-content" class="main-content">
    <!-- Daily Summary (70%) -->
    <div class="column-left">
      <div id="daily-summary" class="section daily-summary hidden">
        <div class="section-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"></path>
          </svg>
          <span class="section-title">Today's Summary</span>
        </div>
        <div id="summary-content" class="section-content"></div>
      </div>
    </div>

    <!-- Recent Pages (30%) -->
    <div class="column-right">
      <div class="section">
        <div class="section-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
          <span class="section-title">Recent</span>
        </div>
        <div id="page-list" class="page-list section-content">
          <div class="empty">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/popup.js"></script>
</body>
</html>
